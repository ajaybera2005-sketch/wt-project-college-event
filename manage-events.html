<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Events - Admin Panel</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin-body">

  <!-- Admin Sidebar -->
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="admin-sidebar-brand">
      <div class="sidebar-logo-icon">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <div>
        <span>Campus<span style="color: #818cf8;">Admin</span></span>
      </div>
    </div>

    <nav class="admin-sidebar-nav">
      <div class="sidebar-section-title">Navigation</div>
      <a href="dashboard.html" class="sidebar-link">
        <i class="fa-solid fa-gauge-high"></i> Dashboard
      </a>
      <a href="manage-events.html" class="sidebar-link active">
        <i class="fa-solid fa-calendar-check"></i> Manage Events
      </a>
      <a href="manage-registrations.html" class="sidebar-link">
        <i class="fa-solid fa-users-viewfinder"></i> Registrations
      </a>

      <div class="sidebar-section-title">Student Portal</div>
      <a href="../index.html" class="sidebar-link" target="_blank">
        <i class="fa-solid fa-arrow-up-right-from-square"></i> Student View
      </a>
      <a href="../events.html" class="sidebar-link" target="_blank">
        <i class="fa-solid fa-compass"></i> Explore Catalog
      </a>
    </nav>

    <div class="admin-sidebar-footer">
      <div class="admin-user-profile">
        <div class="admin-avatar-circle" id="admin-display-avatar">AD</div>
        <div class="admin-user-info">
          <span class="admin-name" id="admin-display-name">Admin Officer</span>
          <span class="admin-role" id="admin-display-email">admin@campus.com</span>
        </div>
        <button type="button" class="btn-icon btn-admin-logout" title="Sign Out" style="background: none; border: none; color: #94a3b8; cursor: pointer;">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- Admin Main Content Wrapper -->
  <div class="admin-main-wrapper">
    <!-- Top Header Bar -->
    <header class="admin-header">
      <div class="admin-header-left">
        <button class="sidebar-toggle-btn" id="admin-sidebar-toggle" aria-label="Toggle Sidebar">
          <i class="fa-solid fa-bars"></i>
        </button>
        <h1 class="admin-page-heading">Campus Event Management</h1>
      </div>

      <div class="admin-header-actions">
        <button type="button" class="btn btn-primary btn-sm" id="btn-open-add-event-modal">
          <i class="fa-solid fa-plus"></i> Add New Event
        </button>
        <button type="button" class="btn btn-ghost btn-sm btn-admin-logout">
          <i class="fa-solid fa-right-from-bracket"></i> Sign Out
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="admin-content-area">
      <!-- Toolbar: Search & Filters -->
      <div class="table-filter-toolbar">
        <div class="filter-left-group">
          <div class="search-input-wrap">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="manage-event-search" placeholder="Search events by title, organizer, or venue...">
          </div>
        </div>

        <div class="filter-right-group">
          <select id="manage-event-category-filter" class="form-control" style="width: auto; min-width: 180px;">
            <option value="all">All Categories</option>
            <option value="Technical Events">Technical Events</option>
            <option value="Cultural Events">Cultural Events</option>
            <option value="Sports Events">Sports Events</option>
            <option value="Workshops">Workshops</option>
            <option value="Seminars">Seminars</option>
            <option value="Other Events">Other Events</option>
          </select>

          <span class="badge badge-student" id="events-table-count">0 total</span>
        </div>
      </div>

      <!-- Events Management Table -->
      <div class="admin-table-container">
        <table class="admin-data-table">
          <thead>
            <tr>
              <th>Event Title & Organizer</th>
              <th>Category</th>
              <th>Date & Time</th>
              <th>Venue</th>
              <th>Capacity / Seats</th>
              <th>Deadline</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="manage-events-table-body">
            <!-- Populated dynamically by js/admin.js -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/events.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
