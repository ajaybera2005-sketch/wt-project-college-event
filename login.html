<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Campus Event Management System</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="site-navbar">
    <div class="container navbar-container">
      <a href="index.html" class="navbar-brand">
        <div class="brand-logo-icon">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <span class="brand-text">Campus<span class="brand-highlight">Events</span></span>
      </a>

      <nav class="navbar-links">
        <a href="index.html" class="nav-link">
          <i class="fa-solid fa-house"></i> Home
        </a>
        <a href="events.html" class="nav-link">
          <i class="fa-solid fa-compass"></i> Explore Events
        </a>
        <a href="index.html#about" class="nav-link">
          <i class="fa-solid fa-circle-info"></i> About Us
        </a>
        <a href="index.html#contact" class="nav-link">
          <i class="fa-solid fa-envelope"></i> Contact
        </a>
      </nav>

      <div class="navbar-right">
        <div id="navbar-auth-section"></div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="auth-page-wrapper">
      <div class="auth-card">
        <div class="auth-card-header">
          <div class="auth-logo-badge">
            <i class="fa-solid fa-lock"></i>
          </div>
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Sign in to access student registrations or admin dashboard</p>
        </div>

        <!-- Quick 1-Click Demo Fill Box -->
        <div class="demo-credentials-box">
          <div class="demo-box-header">
            <i class="fa-solid fa-wand-magic-sparkles text-primary"></i> Quick Demo Logins
          </div>
          <div class="demo-fill-buttons">
            <button type="button" class="demo-fill-btn" id="fill-demo-admin">
              <i class="fa-solid fa-shield-halved text-primary"></i> Fill Demo Admin
            </button>
            <button type="button" class="demo-fill-btn" id="fill-demo-student">
              <i class="fa-solid fa-user-graduate text-success"></i> Fill Demo Student
            </button>
          </div>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email Address <span class="required">*</span></label>
            <input type="email" id="login-email" class="form-control" placeholder="admin@campus.com or student@campus.edu" required autocomplete="email">
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
              <label for="login-password" style="margin-bottom: 0;">Password <span class="required">*</span></label>
              <a href="#" onclick="showToast('For demo testing, use admin123 (for admin) or student123 (for students)', 'info', 'Demo Password'); return false;" style="font-size: 0.78rem;">Forgot password?</a>
            </div>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          </div>

          <div class="form-check-group">
            <input type="checkbox" id="login-remember" checked>
            <label for="login-remember">Remember my session</label>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login-submit">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); font-size: 0.9rem;">
          <span class="text-muted">New student at campus?</span>
          <a href="signup.html" style="font-weight: 700; margin-left: 0.35rem;">Create Student Account</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
