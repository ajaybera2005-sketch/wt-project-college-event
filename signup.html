<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Campus Events</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="site-navbar">
    <div class="container navbar-container">
      <a href="index.html" class="navbar-brand">
        <div class="brand-logo-icon">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <span class="brand-text">Campus<span class="brand-highlight">Events</span></span>
      </a>

      <nav class="navbar-links">
        <a href="index.html" class="nav-link">
          <i class="fa-solid fa-house"></i> Home
        </a>
        <a href="events.html" class="nav-link">
          <i class="fa-solid fa-compass"></i> Explore Events
        </a>
        <a href="index.html#about" class="nav-link">
          <i class="fa-solid fa-circle-info"></i> About Us
        </a>
        <a href="index.html#contact" class="nav-link">
          <i class="fa-solid fa-envelope"></i> Contact
        </a>
      </nav>

      <div class="navbar-right">
        <div id="navbar-auth-section"></div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="auth-page-wrapper">
      <div class="auth-card" style="max-width: 580px;">
        <div class="auth-card-header">
          <div class="auth-logo-badge">
            <i class="fa-solid fa-user-plus"></i>
          </div>
          <h1 class="auth-title">Create Student Profile</h1>
          <p class="auth-subtitle">Join the collegiate community to register for campus hackathons and fests</p>
        </div>

        <form id="signup-form">
          <div class="form-group">
            <label for="signup-name">Full Student Name <span class="required">*</span></label>
            <input type="text" id="signup-name" class="form-control" placeholder="e.g. Maya Krishnan" required>
          </div>

          <div class="form-row">
            <div class="form-group col-half">
              <label for="signup-email">Campus Email <span class="required">*</span></label>
              <input type="email" id="signup-email" class="form-control" placeholder="maya@student.campus.edu" required>
            </div>

            <div class="form-group col-half">
              <label for="signup-studentid">Student ID / Roll No <span class="required">*</span></label>
              <input type="text" id="signup-studentid" class="form-control" placeholder="CS-2024-088" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group col-half">
              <label for="signup-department">Department / Faculty <span class="required">*</span></label>
              <select id="signup-department" class="form-control" required>
                <option value="">Select Department</option>
                <option value="Computer Science & Engineering">Computer Science & Eng</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Electronics & Communication">Electronics & Communication</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
                <option value="Civil Engineering">Civil Engineering</option>
                <option value="Business Administration (MBA/BBA)">Business Administration</option>
                <option value="Sciences & Humanities">Sciences & Humanities</option>
              </select>
            </div>

            <div class="form-group col-half">
              <label for="signup-phone">Mobile Number</label>
              <input type="tel" id="signup-phone" class="form-control" placeholder="+91 98765 43210">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group col-half">
              <label for="signup-password">Create Password <span class="required">*</span></label>
              <input type="password" id="signup-password" class="form-control" placeholder="Min 6 characters" required>
            </div>

            <div class="form-group col-half">
              <label for="signup-confirm-password">Confirm Password <span class="required">*</span></label>
              <input type="password" id="signup-confirm-password" class="form-control" placeholder="Re-type password" required>
            </div>
          </div>

          <div class="form-check-group">
            <input type="checkbox" id="signup-terms" checked required>
            <label for="signup-terms">I agree to abide by the university campus event regulations and guidelines.</label>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-signup-submit">
            <i class="fa-solid fa-user-check"></i> Register Account
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); font-size: 0.9rem;">
          <span class="text-muted">Already have a campus account?</span>
          <a href="login.html" style="font-weight: 700; margin-left: 0.35rem;">Log In Here</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
